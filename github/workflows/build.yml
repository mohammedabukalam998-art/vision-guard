name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Unpack project
        run: |
          test -f project.zip || { echo "project.zip غير موجود في جذر المستودع"; exit 1; }
          unzip -q project.zip -d project

      - name: Download model from release "model"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl project/app/src/main/assets
          gh release download model --repo "$GITHUB_REPOSITORY" --dir dl
          cd dl
          for z in *.zip; do
            if [ -e "$z" ]; then unzip -o "$z"; fi
          done
          f=$(find . -name '*.tflite' | head -n 1)
          test -n "$f" || { echo "لا يوجد ملف tflite في الإصدار model"; exit 1; }
          cp "$f" ../project/app/src/main/assets/nudenet.tflite
          ls -la ../project/app/src/main/assets

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vision-guard-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
